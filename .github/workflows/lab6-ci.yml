name: Lab6 CI

on:
  push:
    branches: [ lab6 ]
  pull_request:
    branches: [ main, lab6 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B compile

      - name: Run Checkstyle
        run: mvn checkstyle:check

      - name: Test Lab6 compilation
        run: |
          echo "=== Проверка компиляции Lab6 ==="
          javac -cp src/main/java src/main/java/com/example/lab6/*.java
          echo "Все классы Lab6 компилируются успешно"

      - name: Verify file structure
        run: |
          echo "=== Проверка структуры Lab6 ==="
          find src/main/java/com/example/lab6 -name "*.java" | sort
          echo "Все необходимые файлы присутствуют"